name: Daily Spotify Playlist Update

on:
  schedule:
    # Runs at 13:00 UTC daily
    # Since you are in Hermosillo (UTC-7), this is 6:00 AM your time.
    - cron: '0 13 * * *'
  
  # Allows you to run this workflow manually from the Actions tab for testing
  workflow_dispatch:

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install spotipy

    - name: Run update script
      env:
        # These secrets must be added in your Repo Settings -> Secrets -> Actions
        SPOTIPY_CLIENT_ID: ${{ secrets.SPOTIPY_CLIENT_ID }}
        SPOTIPY_CLIENT_SECRET: ${{ secrets.SPOTIPY_CLIENT_SECRET }}
        SPOTIPY_REDIRECT_URI: ${{ secrets.SPOTIPY_REDIRECT_URI }}
        SPOTIPY_REFRESH_TOKEN: ${{ secrets.SPOTIPY_REFRESH_TOKEN }}
        TARGET_PLAYLIST_ID: ${{ secrets.TARGET_PLAYLIST_ID }}
      run: python main.py
